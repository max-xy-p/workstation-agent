services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: workstation
      POSTGRES_DB: workstation_agent
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请先设置数据库密码}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workstation -d workstation_agent"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
