[project]
name = "workstation-agent"
version = "0.2.0"
description = "A small, provider-agnostic foundation for building workstation agents."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.12,<3",
    "langgraph>=1.0,<2",
    "mcp>=2.3,<3",
    "uvicorn>=0.54,<1",
    "starlette>=1.7,<2",
    "httpx2>=2,<3",
    "langchain>=1.0,<2",
    "langchain-openai>=1.0,<2",
    "langchain-text-splitters>=1,<2",
    "langchain-classic>=1,<2",
    "rank-bm25>=0.2.2,<1",
    "markdown-it-py>=4,<5",
    "langgraph-checkpoint-sqlite>=3,<4",
    "langmem>=0.0.30,<0.1",
]

[project.scripts]
workstation-agent = "workstation_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/workstation_agent"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]
